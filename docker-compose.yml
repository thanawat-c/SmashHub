version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smashhub-postgres
    restart: always
    environment:
      POSTGRES_USER: smashhub
      POSTGRES_PASSWORD: smashhub_secret
      POSTGRES_DB: smashhub_db
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smashhub -d smashhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
